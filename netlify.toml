[build]
  command = "npm run build"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "24.12.0"
  VITE_STATIC_DEMO = "true"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
