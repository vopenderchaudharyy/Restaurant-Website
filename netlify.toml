[build]
  command = "npm run build"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "24.12.0"
  VITE_STATIC_DEMO = "false"

[[redirects]]
  from = "/api/*"
  to = "https://menumate-api.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
