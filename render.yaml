services:
  - type: web
    name: menumate-api
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci --omit=dev
    startCommand: npm run start --workspace server
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: CLIENT_ORIGIN
        value: https://menumateweb.netlify.app
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: restuarantwebsite
      - key: MONGODB_MIGRATE_FROM
        value: test
